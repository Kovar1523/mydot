;; pywal 템플릿: ~/.config/wal/apply.sh 를 실행할 때마다 ~/.cache/wal/colors-polybar.ini 로 다시 만들어짐

[color]

;; 배경은 고정: 검정 30% (kitty background #000000 + opacity 0.3 과 같음)
background = #4D000000
foreground = {foreground}
foreground-alt = {color8}
primary = {color6}
red = {color1}
orange = {color11}
green = {color2}
yellow = {color3}

;; 흰색 포인트 (11-04): 배경화면(남색·틸·검정)에 없는 밝은 색 → 포커스된 것에만 씀. wal과 무관한 고정값 (Nord6)
white = #ECEFF4

; Polybar accent (focused tag underline)
accent = {color3}

;; miniblocks 원본 색: 원본 config는 xrdb의 color0(배경) · color7(글자) · color15(강조)를 읽음
;; apply.sh는 wal -e라 xrdb에 색을 안 넣으므로 같은 pywal 색을 여기서 넘겨줌
color0 = {color0}
;; 바 글자·아이콘 색 (11-05): color7 칸 순서와 상관없이 기존 흰색(wal foreground) 유지
color7 = {foreground}
color15 = {color15}
