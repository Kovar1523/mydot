# pywal 템플릿: ~/.config/wal/apply.sh 를 실행할 때마다 ~/.cache/wal/dunst.conf 로 다시 만들어짐
# ~/.config/dunst/dunstrc.d/50-wal.conf 가 이 파일을 가리키고, dunstrc 의 같은 키(색)만 덮어씀
# Nord로 되돌리기: 50-wal.conf 링크를 지우고 dunstctl reload

[global]
    # 흰색 포인트 (11-04): 일반 알림 테두리·진행 막대 = #ECEFF4 고정 (원래 {color6})
    frame_color = "#ECEFF4"

[urgency_low]
    background = "#0000004D"
    foreground = "{foreground}"
    frame_color = "{color8}"
    highlight = "{color4}"

[urgency_normal]
    background = "#0000004D"
    foreground = "{foreground}"
    frame_color = "#ECEFF4"
    highlight = "#ECEFF4"

[urgency_critical]
    # fixed semantic colors, not palette slots
    background = "#0000004D"
    foreground = "{color15}"
    frame_color = "#BF616A"
    highlight = "#BF616A"

# batsignal 테두리 (조건을 다시 적어 둬야 다른 알림에 번지지 않음)
[ko_batsignal_warning]
    appname = batsignal
    summary = "Battery is low"
    frame_color = "#D08770"

[ko_batsignal_critical]
    appname = batsignal
    summary = "Battery is critically low"
    frame_color = "#BF616A"
