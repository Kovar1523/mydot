# Font for tray icon labels (size is ignored: fcitx5 uses 70% of the icon size)
TrayFont="D2KodingLigature Nerd Font 11"

# 입력기 전환 팝업·후보창 글꼴 (fcitx5 5.1은 테마의 Font 대신 이 값을 씀, 기본값 Sans 10).
# 한글 라벨(U+10FF00)용 태극 글꼴을 명시: 빼면 자동 대체가 polybar용 "Fcitx Taegeuk Bar"를 골라
# 태극 팝업이 "en" 팝업보다 넓어짐 (Fcitx Taegeuk은 글자 폭을 "en"과 같게 줄인 버전)
Font="Fcitx Taegeuk,Sans 10"

Theme=nord
