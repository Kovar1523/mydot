"$schema" = 'https://starship.rs/config-schema.json'

format = '''
[┌](fg:#226eff)[─](fg:#2072ee)[─](fg:#1d76dc)[─](fg:#1b7bca)[─](fg:#187fb9)[─](fg:#1683a8)[─](fg:#148896)[─](fg:#118c84)[─](fg:#0f9073)[─](fg:#1b8d75)[─](fg:#268a77)[─](fg:#328779)[─](fg:#3e847c)[─](fg:#49827e)[─](fg:#557f80)[─](fg:#607c82)[─](fg:#6c7984)[─](fg:#77828c)[─](fg:#828c94)[─](fg:#8c959d)[─](fg:#979ea5)[─](fg:#a2a8ad)[─](fg:#acb1b6)[─](fg:#b7bbbe)[─](fg:#c2c4c6)[\[ ](8)$directory[ \]](8)$rust$package
[└─>](fg:#226eff) '''

add_newline = false

[directory]
style = "fg:7"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol $branch ](fg:#88C0D0 bg:#434C5E)]($style)'

[git_status]
style = "bg:#434C5E"
format = '[[($all_status$ahead_behind )](fg:#88C0D0 bg:#434C5E)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#88C0D0 bg:#434C5E)]($style)'

[jj_status]
style = "bg:#434C5E"
format = '[[($all )](fg:#88C0D0 bg:#434C5E)]($style)'

[nodejs]
symbol = ""
style = "bg:#3B4252"
format = '[[ $symbol ($version) ](fg:#88C0D0 bg:#3B4252)]($style)'

[bun]
symbol = ""
style = "bg:#3B4252"
format = '[[ $symbol ($version) ](fg:#88C0D0 bg:#3B4252)]($style)'

[rust]
symbol = ""
style = "bg:#3B4252"
format = '[[ $symbol ($version) ](fg:#88C0D0 bg:#3B4252)]($style)'

[golang]
symbol = ""
style = "bg:#3B4252"
format = '[[ $symbol ($version) ](fg:#88C0D0 bg:#3B4252)]($style)'

[php]
symbol = ""
style = "bg:#3B4252"
format = '[[ $symbol ($version) ](fg:#88C0D0 bg:#3B4252)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2E3440"
format = '[[  $time ](fg:#D8DEE9 bg:#2E3440)]($style)'

[os]
style = "bg:#D8DEE9 fg:#2E3440"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = ""
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
success_symbol = "[❯](bold #88C0D0)"
error_symbol = "[❯](bold #BF616A)"
vimcmd_symbol = "[❮](bold #88C0D0)"
