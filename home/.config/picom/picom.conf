#################################
#            Shadows            #
#################################
# Enables client-side shadows on windows.
# Default: false
shadow = true;

# Blur radius for shadows, in pixels.
# Default: 12
shadow-radius = 14;

# Horizontal offset for shadows, in pixels.
# Default: -15
shadow-offset-x = -7;

# Vertical offset for shadows, in pixels.
# Default: -15
shadow-offset-y = -7;

# Example if you want custom shadow opacity:
shadow-opacity = 0.5

#################################
#             Fading            #
#################################
# Fade windows in/out on open/close and opacity changes.
# Default: false
fading = true;

# Opacity increase per step while fading in.
# Range: 0.01 - 1.0, default: 0.028
fade-in-step = 0.03;

# Opacity decrease per step while fading out.
# Range: 0.01 - 1.0, default: 0.03
fade-out-step = 0.03;

# If needed, time between fade steps in ms (default 10):
# fade-delta = 10


#################################
#   Transparency / Opacity      #
#################################
# Opacity of window titlebars/borders, range 0.1 - 1.0
# Default: 1.0
frame-opacity = 0.7;


#################################
#           Corners             #
#################################
# Radius for rounded corners, default 0 (disabled)
corner-radius = 0;


#################################
#            Blur               #
#################################
# Blur is opt-in per window, see the blur rule below.
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = false;
blur-background-frame = false;


#################################
#       General Settings        #
#################################
# Backend: "xrender", "glx", or "egl".
# Default: "xrender"
backend = "glx";

# Use higher-precision rendering and dithering. 
# Reduces banding, might cost performance. Only for GLX/EGL.
dithered-present = false;

# Enable VSync.
# Default: false
vsync = false;

# Attempt to detect windows with rounded corners.
# Default: false
detect-rounded-corners = true;

# Detect _NET_WM_WINDOW_OPACITY on client windows.
# Default: false
detect-client-opacity = true;

# Use WM_TRANSIENT_FOR to group windows for focus.
# Default: false
detect-transient = true;

# Redraw only changed parts of the screen (improves performance).
# Default: false
use-damage = true;


#################################
#           Animations          #
#################################
animations = (
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.24;
    scale = 1.0;
  },
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.24;
    scale = 0.98;
  }
);


#################################
#       Rule-based Options      #
#################################
# 'rules' can be specified as rules: (...) or rules = (...), 
# depending on your picom version.

rules: ( 
  ##########################################
  # Basic examples from your config
  ##########################################
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.75;
    full-shadow = false;
  },
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop' || "
            "_GTK_FRAME_EXTENTS@";
    blur-background = false;
  },
  {
    match = "window_type != 'dock'";
    # Example: if you want a custom shader, uncomment:
    # shader = "my_shader.frag";
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
  },

  # Blur behind translucent UI (must stay after the dock rule).
  {
    match = "class_g = 'kitty' || "
            "class_g = 'Polybar' || "
            "class_g = 'Rofi' || "
            "class_g = 'Dunst' || "
            "class_g = 'Eww' || "
            "(class_g = 'firefox' && !fullscreen)";
    blur-background = true;
  },

  ##########################################
  #  Original shadow-exclude / fade-exclude / opacity-rule expansions
  #  Each match that sets shadow=false is effectively "shadow-exclude".
  #  If needed, fade=false is also "fade-exclude".
  ##########################################
  {
    match = "! name~=''";
    shadow = false;
  },
  {
    match = "name = 'Notification'";
    shadow = false;
  },
  {
    match = "name = 'Plank'";
    shadow = false;
  },
  {
    match = "name = 'Docky'";
    shadow = false;
  },
  {
    match = "name = 'Kupfer'";
    shadow = false;
  },
  {
    match = "name = 'xfce4-notifyd'";
    shadow = false;
  },
  {
    match = "name = 'cpt_frame_window'";
    shadow = false;
  },
  {
    match = "name *= 'VLC'";
    shadow = false;
  },
  {
    match = "name *= 'compton'";
    shadow = false;
  },
  {
    match = "name *= 'picom'";
    shadow = false;
  },
  {
    match = "name *= 'Chromium'";
    shadow = false;
  },
  {
    match = "name *= 'Chrome'";
    shadow = false;
  },
  {
    match = "name *= 'conky'";
    shadow = false;
  },
  {
    match = "class_g = 'Conky'";
    shadow = false;
    fade = false;  # also disable fading for Conky
  },
  {
    match = "class_g = 'Kupfer'";
    shadow = false;
  },
  {
    match = "class_g = 'Synapse'";
    shadow = false;
  },
  {
    match = "class_g ?= 'Notify-osd'";
    shadow = false;
  },
  {
    match = "class_g ?= 'Cairo-dock'";
    shadow = false;
  },
  {
    match = "class_g ?= 'Xfce4-notifyd'";
    shadow = false;
  },
  {
    match = "class_g ?= 'Xfce4-power-manager'";
    shadow = false;
  },
  {
    match = "class_g ?= 'ulauncher'";
    shadow = false;
  },
  {
    match = "class_g ?= 'rofi'";
    shadow = false;
  },
  # Opacity rules
  {
    match = "class_g = 'copyq'";
    opacity = 0.80;
  },
  {
    match = "name = 'alttab'";
    opacity = 0.90;
  },
  # Additional
  {
    match = "window_type *= 'menu'";
    shadow = false;
  },
  {
    match = "name *?= 'firefox'";
    shadow = false;
  },
  {
    match = "class_g *?= 'conky'";
    shadow = false;
  },
  {
    match = "window_type = 'desktop'";
    shadow = false;
  },

  # xwinwrap live wallpaper (-fdt sets the desktop type): the window maps black
  # and mpv draws its first frame ~1.6 s later, so hold it transparent, then fade in
  {
    match = "window_type = 'desktop'";
    animations = ({
      triggers = ["open", "show"];
      opacity = {
        curve = "cubic-bezier(0, 0, 0.58, 1)";
        delay = 2.5;
        duration = 1.0;
        start = 0;
        end = "window-raw-opacity";
      };
      blur-opacity = "opacity";
      shadow-opacity = "opacity";
    });
  },

  ##########################################
  #  Geometry animation rule
  ##########################################
  {
    match = "MANUAL@ != 1";
    animations = ({
      triggers = ["geometry"];
      preset = "geometry-change";
      duration = 0.24;
    });
  },

  ##########################################
  #  dwm tag switch
  #  dwm sets _DWM_TAGHIDE right before it unmaps/maps a client:
  #    1 hide / 2 show in place (no direction: toggleview, view all)
  #    3/4 hide sliding left/right, 5/6 show sliding left/right
  #    7 fade out in place (focused client sent to another tag)
  #  Rules 3-6 share distance, duration and curve so both tags move as one strip.
  #  offset-x is the timing function itself, so a quick re-switch continues
  #  from the current position instead of jumping.
  #  picom gives unmapped windows opacity 0, so hide scripts hold the opacity
  #  from before the unmap (-before values are only valid in start/end).
  #  "geometry" in the show rules covers a relayout in the same arrange.
  ##########################################
  {
    match = "_DWM_TAGHIDE@ = 1";
    animations = ({
      triggers = ["hide"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      var-scale = {
        duration = 0.363;
        curve = "cubic-bezier(0.36, 0, 0.66, -0.56)";
        start = 1;
        end = 0.85;
      };
      scale-x = "var-scale";
      scale-y = "var-scale";
      shadow-scale-x = "var-scale";
      shadow-scale-y = "var-scale";
      offset-x = "(1 - var-scale) * window-width / 2";
      offset-y = "(1 - var-scale) * window-height / 2";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
      opacity = {
        duration = 0.33;
        delay = 0.033;
        curve = "cubic-bezier(0.4, 0, 1, 1)";
        start = "window-raw-opacity-before";
        end = 0;
      };
      shadow-opacity = "opacity";
      blur-opacity = {
        duration = 0.33;
        delay = 0.033;
        curve = "cubic-bezier(0.4, 0, 1, 1)";
        start = "window-blur-opacity-before";
        end = 0;
      };
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 2";
    animations = ({
      triggers = ["show", "open", "geometry"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      var-scale = {
        duration = 0.561;
        delay = 0.099;
        curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
        start = 0.86;
        end = 1;
      };
      scale-x = "var-scale";
      scale-y = "var-scale";
      shadow-scale-x = "var-scale";
      shadow-scale-y = "var-scale";
      offset-x = "(1 - var-scale) * window-width / 2";
      offset-y = "(1 - var-scale) * window-height / 2";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
      opacity = {
        duration = 0.264;
        delay = 0.099;
        curve = "cubic-bezier(0, 0, 0.2, 1)";
        start = 0;
        end = "window-raw-opacity";
      };
      shadow-opacity = "opacity";
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 3";
    animations = ({
      triggers = ["hide"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      offset-x = {
        duration = 0.528;
        curve = "cubic-bezier(0.3, 1.25, 0.5, 1)";
        start = 0;
        end = "-window-monitor-width";
      };
      shadow-offset-x = "offset-x";
      opacity = {
        duration = 0.528;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity-before";
      };
      shadow-opacity = "opacity";
      blur-opacity = {
        duration = 0.528;
        start = "window-blur-opacity-before";
        end = "window-blur-opacity-before";
      };
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 4";
    animations = ({
      triggers = ["hide"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      offset-x = {
        duration = 0.528;
        curve = "cubic-bezier(0.3, 1.25, 0.5, 1)";
        start = 0;
        end = "window-monitor-width";
      };
      shadow-offset-x = "offset-x";
      opacity = {
        duration = 0.528;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity-before";
      };
      shadow-opacity = "opacity";
      blur-opacity = {
        duration = 0.528;
        start = "window-blur-opacity-before";
        end = "window-blur-opacity-before";
      };
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 5";
    animations = ({
      triggers = ["show", "open", "geometry"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      offset-x = {
        duration = 0.528;
        curve = "cubic-bezier(0.3, 1.25, 0.5, 1)";
        start = "window-monitor-width";
        end = 0;
      };
      shadow-offset-x = "offset-x";
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 6";
    animations = ({
      triggers = ["show", "open", "geometry"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      offset-x = {
        duration = 0.528;
        curve = "cubic-bezier(0.3, 1.25, 0.5, 1)";
        start = "-window-monitor-width";
        end = 0;
      };
      shadow-offset-x = "offset-x";
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
    });
  },
  {
    match = "_DWM_TAGHIDE@ = 7";
    animations = ({
      triggers = ["hide"];
      suppressions = ["increase-opacity", "decrease-opacity", "color"];
      opacity = {
        duration = 0.33;
        curve = "cubic-bezier(0.4, 0, 0.2, 1)";
        start = "window-raw-opacity-before";
        end = 0;
      };
      shadow-opacity = "opacity";
      blur-opacity = {
        duration = 0.33;
        curve = "cubic-bezier(0.4, 0, 0.2, 1)";
        start = "window-blur-opacity-before";
        end = 0;
      };
    });
  }
)
