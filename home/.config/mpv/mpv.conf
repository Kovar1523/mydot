# uosc(scripts/uosc)가 재생바·OSD를 대신 그리므로 mpv 기본 OSC/OSD 바는 끔
osc=no
osd-bar=no

# 하드웨어 디코딩은 AMD iGPU(VA-API)로 고정 — auto는 NVDEC를 골라 NVIDIA dGPU를 깨울 수 있음
hwdec=vaapi

# 끝까지 재생해도 창을 닫지 않고 마지막 프레임에서 멈춤
keep-open=yes

# OSD 메시지 (uosc 글꼴도 osd-font를 따라감) — Nord
osd-font='JetBrainsMono Nerd Font Mono'
osd-font-size=32
osd-color='#D8DEE9'
osd-border-color='#2E3440'
osd-border-size=2
osd-shadow-offset=0

# Embedded wallpaper (xwinwrap -wid): loop, no audio, no progress bar,
# OpenGL output so VA-API decoding works on the display GPU
[wallpaper]
profile-cond=p.wid ~= -1
loop-file=inf
aid=no
script-opts-append=uosc-progress=never
vo=gpu
gpu-api=opengl
hwdec=vaapi,nvdec
