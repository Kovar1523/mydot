[dmenu]
# polybar hack 테마의 rofi 메뉴: btop 스타일 상자 (connected / available / 번호 menu, scripts/nmdm/rofi 래퍼)
# shlex로 나눠 바로 실행하므로 ~ 대신 절대 경로를 쓴다
# scripts/nmdm/rofi: 칸 나눔(connected/available/menu), 숫자키 단축키, Wi-Fi 줄 배치, 비밀번호·하위 목록 테마(networkpass/networksub.rasi)를 맡는 rofi 래퍼
dmenu_command = /home/kovar1523/.config/polybar/miniblocks/scripts/nmdm/rofi -no-config -theme /home/kovar1523/.config/polybar/miniblocks/scripts/rofi/networkmenu.rasi
# 연결된 네트워크 표시 (길이를 바꾸면 scripts/nmdm/rofi의 MARK도 바꾼다)
active_chars = *
highlight = False
compact = False
# 신호 0~4칸: polybar scripts/network.sh와 같은 MDI network-strength 아이콘
# (칸 수 = round(신호 / 25), 바 스크립트도 같은 기준)
wifi_icons = 󰣾󰣴󰣶󰣸󰣺
# 이름, 보안, 아이콘을 탭으로 구분한다. 줄 배치(아이콘을 SSID 앞에, 보안 우정렬, 긴 이름 줄임)는
# scripts/nmdm/rofi 래퍼가 한다
format = {name}	{sec}	{icon}
list_saved = False
prompt = Networks

[dmenu_passphrase]
# rofi -password: 입력한 비밀번호를 *로 가린다
obscure = True

[editor]
# Launch Connection Manager: nm-connection-editor가 없으면 kitty에서 nmtui
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True
