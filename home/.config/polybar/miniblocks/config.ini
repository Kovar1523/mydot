;==========================================================
;
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

;   kiddae/polybar-themes miniblocks 원본(config.ini.upstream) 그대로.
;   dwm·이 PC에서 안 돌아가는 곳만 바꿈 (각 자리에 "원본:" 주석):
;   - 색: xrdb → 같은 pywal 색 (~/.cache/wal/colors-polybar.ini)
;   - 배경: 불투명 color0 → 흰색 10% 반투명 (젖빛 유리, 어두운 배경화면에서 잘 보이게) + 뒤 화면 blur (picom.conf의 Polybar 규칙)
;   - 작업공간: bspwm → xworkspaces (dwm 태그 1~5를 원본처럼 로마자 I~V로)
;   - 음악: mpd(설치 안 됨) → playerctl, 표시는 원본 mpd 형식 그대로
;   - Font: JetBrainsMono Nerd Font Mono 14px (same as kitty 10.5pt), Hangul = Pretendard 16px (font-3)
;   - 추가: 오른쪽 블록에 네트워크·배터리 (기존 hack 바의 기능, 모양은 원본 소리 모듈처럼 아이콘 + 숫자)
;   - 크기: 바 높이·music 폭은 원본의 1.3배, 글꼴은 번짐 없는 크기 (dpi = 75로 적은 값 그대로), ws·tray 폭은 내용에 맞춤
;   - Icons: from JetBrainsMono Nerd Font Mono, per-icon sizes so every icon is 12-13px tall (font-5..10)
;   실행: ~/.config/polybar/launch.sh --miniblocks (dwm altbarcmd)

include-file = ~/.cache/wal/colors-polybar.ini

[colors]

; Background: black 30% like kitty (#4D000000, AARRGGBB), blurred by picom
background = #4D000000
foreground = ${color.color7}
; Highlight (wal foreground white): focused tag underline only
highlight = ${color.foreground}
dim = ${color.foreground-alt}

;  _                    
; | |__   __ _ _ __ ___ 
; | '_ \ / _` | '__/ __|
; | |_) | (_| | |  \__ \
; |_.__/ \__,_|_|  |___/

[bar/base]
enable-ipc = true
; 원본: pixelsize 9, 8, size 10 / 세로 위치 2, 2, 3
; polybar는 글꼴 크기를 fontconfig의 pt 값 × dpi/72로 다시 계산하는데, fontconfig는 pixelsize를 75dpi 기준 pt로 바꿈
; → dpi 기본값 96이면 실제 크기 = 적은 값 × 1.28 (원본 9 → 11.5px이라 번짐). dpi = 75면 적은 값 그대로 px
dpi = 75
; Text: 14px = 8px cell, cap height 10px
font-0=JetBrainsMono Nerd Font Mono:pixelsize=14;3
font-1=FontAwesome5Free:style=Solid:pixelsize=12:antialias=true;3
font-2=IPAGothic:style=Regular:pixelsize=13:antialias=true;3
; 추가: 한글 (위 글꼴에 없는 글자만 여기서 그림) = Pretendard 16px (kitty도 symbol_map으로 같은 글꼴)
font-3=Pretendard:pixelsize=16;4
; Arch logo (launcher label-font = 5)
font-4=JetBrainsMono Nerd Font Mono:pixelsize=27;6
; Icon slots: Mono shrinks each icon to one cell, so sizes are picked per icon
; to give equal heights centered on the text (%{T6}..%{T11} = font-5..10)
font-5=JetBrainsMono Nerd Font Mono:pixelsize=29;6
font-6=JetBrainsMono Nerd Font Mono:pixelsize=20;5
font-7=JetBrainsMono Nerd Font Mono:pixelsize=28;6
font-8=JetBrainsMono Nerd Font Mono:pixelsize=12;2
font-9=JetBrainsMono Nerd Font Mono:pixelsize=20;4
; Notification bell (notif)
font-10=JetBrainsMono Nerd Font Mono:pixelsize=17;4

padding = 2
border-size = 0
border-color = ${colors.foreground}

; 원본 30 (×1.3)
height = 39
;radius = 20
;Works very well with a radius like this! Put it on every bar.

background = ${colors.background}
foreground = ${colors.foreground}
override-redirect=false
offset-y = 10

; 원본: wm-restack = bspwm (bspwm 전용)

; 추가: Arch 로고만 담은 바 (11-03에 ws 바에서 떼어 냄), 로고 잉크 여백 좌우 12·위 12·아래 11px (실측)
; 원본 10 → dwm gappx 12에 맞춤 (왼쪽 끝 = 창 테두리 왼쪽 끝)
[bar/logo]
inherit = bar/base
width = 40
offset-x = 12
padding = 0
modules-center = launcher

[bar/ws]
inherit = bar/base
; 원본 14.5% (bspwm 작업공간 I~X 10개 폭) → dwm 태그 I~V 내용 폭에 맞춤 (I 앞·V 뒤 잉크 여백 23px, 실측)
width = 179
padding-left = 13px
padding-right = 13px

; 로고 바 오른쪽 끝에서 12px (= dwm gappx) 띄움: 12 + 40 + 12
offset-x = 64
line-size = 1

; 원본: modules-left = bspwm, scroll-up = bspwm-desknext, scroll-down = bspwm-deskprev (bspwm 전용)
; 휠은 workspaces 모듈의 enable-scroll이 대신함
; Arch 로고 (launcher)는 위 [bar/logo]로 옮김
; 추가: 태그 밑줄 애니메이션 (wsline, 반드시 workspaces 바로 뒤)
modules-left = workspaces wsline

[bar/music]
inherit = bar/base
enable-ipc = true
; 원본 25%, 37.5% → ×1.3 = 32.5%(624px)에서 사용자 요청으로 약간 줄임: 576px (48px↓, 제목 영역 64칸)
; 가운데 정렬 유지: offset = 50% - width/2
width = 576

offset-x = 50%:-288

; Mpd
; 원본: modules-center = mpd (mpd 설치 안 됨)
modules-center = music

[bar/tray]
inherit = bar/base
; 원본 9%, 90.5%: 네트워크·배터리를 넣어 내용 폭에 맞춤 (오른쪽 여백 0.5% 유지)
; 양 끝 잉크 여백 23px (ws 바와 같음, 음량 25~74%·충전 안 할 때 실측). 아이콘 자리 폭이 상태마다 같아 음량·충전으로 폭이 안 변함 (음소거면 숫자가 없어 더 남음)
; 11-03 시계 오른쪽에 알림 벨(notif)을 넣어 315 → 350
; 11-03 폭을 내용에 맞춰 바꿈 ([module/traywidth]): 여기 width는 가장 넓은 상태 = 소리 켜짐 + Wi-Fi 끊김(×) 363
;        창은 늘 363 그대로, traywidth가 X Shape로 보이는 영역의 왼쪽 경계만 잘라 냄 (소리 켜짐·연결 350, 음소거 320 …)
; 11-04 내용을 오른쪽에 붙임 (modules-right): 폭이 바뀌어도 시계·벨은 제자리, 유리 배경 왼쪽 끝만 움직임
;        (처음엔 왼쪽에 붙이고 창을 옮겼더니 글자가 한 번 밀렸다 돌아와 흔들렸음)
width = 363
; 오른쪽 끝 벨 → 바 끝 잉크 여백 23px (padding 2칸 = 16px면 16px)
padding-right = 23px
; 원본 99.5% 여백(≈10px) → dwm gappx 12에 맞춤 (오른쪽 끝 = kitty 테두리 오른쪽 끝, 1920-12-363)
offset-x = 100%:-375

; 원본: modules-left = pulseaudio time
; traywidth = 폭 맞춤 (맨 앞에 눈에 안 보이는 1px 표식만 그림)
modules-right = traywidth pulseaudio network battery time notif

;                      _       _           
;  _ __ ___   ___   __| |_   _| | ___  ___ 
; | '_ ` _ \ / _ \ / _` | | | | |/ _ \/ __|
; | | | | | | (_) | (_| | |_| | |  __/\__ \
; |_| |_| |_|\___/ \__,_|\__,_|_|\___||___/
                                         
[module/wsnumber]
type = custom/script
exec = bspc query -D -d focused --names
tail = true
interval = 0
format-margin = 2
format = "<label>"
scroll-up = bspc desktop -f next
scroll-down = bspc desktop -f prev

[module/xwindow]
type = internal/xwindow
label = %title:0:33:...%
label-margin = 2

[module/bspwm]
type = internal/bspwm
reverse-scroll = false

label-focused = %name%
label-focused-underline = ${colors.highlight}
label-focused-foreground = ${colors.foreground}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

[module/mpd]
type = internal/mpd
host = 127.0.0.1
port = 6600
format-online = <icon-prev> <toggle> <icon-next>   <label-song>  <label-time>
format-online-margin = 2

format-offline = <label-offline>
label-offline =   offline
format-offline-padding = 2

icon-prev = 
icon-stop = 
icon-play = 
icon-pause = 
icon-next = 

label-song-maxlen = 50
label-song-ellipsis = true

; 추가 (기존 hack 바의 launcher 기능): Arch 로고, 좌클릭 = 앱 런처 (MOD+p와 같은 메뉴)
; - Shape: nf-linux-archlinux U+F303 in font-4
; - 자리: 따로 떼어 낸 [bar/logo] 가운데 (padding 없음)
[module/launcher]
type = custom/text
label = 
label-foreground = ${colors.foreground}
label-font = 5
; 11-05: 런처 (MOD+p와 같은 adi1090x type-6 style-6). 이전 = powermenu type-4 style-2 (전원 키로 계속 열림)
click-left = rofi -no-config -no-lazy-grab -show drun -theme ~/.config/rofi/launchers/type-6/style-6.rasi &

; 원본 [module/bspwm]과 같은 모양: dwm 태그(EWMH 이름 1~5)를 로마자로
[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

icon-0 = 1;I
icon-1 = 2;II
icon-2 = 3;III
icon-3 = 4;IV
icon-4 = 5;V

label-active = %icon%
; 밑줄은 아래 [module/wsline]이 슬라이드 애니메이션으로 그림 (원래 이 줄)
;label-active-underline = ${colors.highlight}
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

; 추가: 태그를 옮길 때 밑줄이 이전 태그에서 새 태그로 미끄러짐 (160ms, polybar엔 이 기능이 없어 scripts/wsline.sh)
; - modules-left에서 workspaces 바로 뒤: workspaces 모듈 끝에서 음수 오프셋으로 되돌아가 밑줄만 그림 (폭 0)
; - 태그 글자·클릭·휠·점유 표시는 위 workspaces 모듈 그대로, dwm의 _NET_CURRENT_DESKTOP만 기다림 (평소 CPU 0)
; - 글꼴 크기·태그 글자·label padding을 바꾸면 스크립트 맨 위 cell·tags·pad도 같이
[module/wsline]
type = custom/script
exec = ~/.config/polybar/miniblocks/scripts/wsline.sh
tail = true
format-underline = ${colors.highlight}

; 가운데 타이틀 (11-04, scripts/music-marquee.py): 포커스 창의 제목 그대로 (앱별 규칙 없음, polybar internal/xwindow와 같은 정보)
;   예) kitty 프롬프트 = 현재 디렉터리 (kitty 셸 통합이 정함), 명령 실행 중 = 그 명령, Firefox = "페이지 제목 — Mozilla Firefox"
; - 원본 [module/mpd] 자리, 버튼(⏮⏯⏭)은 사용자 요청으로 뺌 (11-02), 곡 정보(playerctl)도 11-04에 뺌
; - 바 안쪽 폭을 넘으면 자르지 않고 마키로 흐름 (기존 hack 바처럼)
;   멈춤 없이 왼쪽으로 30px/초, 양 끝 흐림, 다섯 칸 띄우고 끊김 없이 반복
;   흐르는 동안 모듈 폭은 늘 512px라 바가 흔들리지 않음, 넘치지 않으면 가운데 그대로
; - 다른 창으로 바뀌면 페이드, 같은 창의 제목만 바뀌면 (kitty 명령, 진행 표시 등) 그 자리에서 바로
; - 포커스 창 없음 (빈 태그): Desktop (원본 label-offline 대신, 아이콘 없이)
[module/music]
type = custom/script
exec = ~/.config/polybar/miniblocks/scripts/music-marquee.py
tail = true
format-margin = 2
; 바 576px - padding 2칸×2 - margin 2칸×2 (한 칸 8px) = 512px (바 width를 바꾸면 여기도)
env-MARQUEE_VIEW_PX = 512
; 글자 폭 계산: polybar와 같은 글꼴·dpi를 참조 (글꼴을 바꿔도 따라감, font-4를 추가하면 여기도 한 줄)
env-MARQUEE_DPI = ${bar/base.dpi}
env-MARQUEE_FONT_0 = ${bar/base.font-0}
env-MARQUEE_FONT_1 = ${bar/base.font-1}
env-MARQUEE_FONT_2 = ${bar/base.font-2}
env-MARQUEE_FONT_3 = ${bar/base.font-3}
; 흐림·페이드는 글자색의 알파로 그림 (배경이 반투명이라 배경색에 섞으면 끝이 검게 남음)
env-MARQUEE_FG = ${colors.foreground}
; 기존 hack 바와 같은 값: 방향, px/초, 멈춤 초, 페이드 초, 끝 흐림 px
env-MARQUEE_DIRECTION = left
env-MARQUEE_SPEED = 30
; 멈춤 0 = 한 바퀴 돌아도 멈추지 않고 계속 흐름 (11-03, 원래 1.5초: 곡 시작·매 바퀴마다 멈췄음)
env-MARQUEE_PAUSE = 0
env-MARQUEE_FADE = 0.2
env-MARQUEE_EDGE_PX = 24
; 포커스 창 없음: "Desktop" 글자만 (11-04; 11-03엔 "Null", 원래 offline 아이콘 U+F05E + "offline", 아이콘 글꼴 env-MARQUEE_OFFLINE_FONT = 7)
env-MARQUEE_OFFLINE = Desktop

; 추가 (기존 hack 바의 네트워크 기능): Wi-Fi 아이콘만 (신호 세기 숫자는 11-02에 뺌)
; - 아이콘: Wi-Fi U+F1EB
; - 인터넷 확인(ping)은 안 함: 연결됨 / 끊김만 (11-02)
; - 끊김: Wi-Fi + × (Terminess에 ✕가 없어 같은 모양의 ×)
; - 좌클릭: rofi Wi-Fi 메뉴 (networkmanager_dmenu), 우클릭: nmtui (hack과 같음)
; - 간격(px, 잉크 기준): 앞뒤 모듈과 24 (%{O}로 맞춤, 클릭 영역 밖: 뒤 %{O8} + 배터리 앞 여백)
[module/network]
type = internal/network
interface-type = wireless
interval = 5

format-connected = %{O15}%{A1:networkmanager_dmenu:}%{A3:kitty -e nmtui:}%{T8}%{T-}%{A}%{A}%{O8}

format-disconnected = %{O15}%{A1:networkmanager_dmenu:}%{A3:kitty -e nmtui:}%{T8}%{T-}%{O5}×%{A}%{A}%{O8}

; 추가 (기존 hack 바의 배터리 기능, batsignal -w 30 -c 15와 같은 기준)
; - 아이콘: MDI 세로 배터리, 잔량 10% 단위 (16~25 → 20, 26~35 → 30, ..., 86~98 → 90, 99 이상 가득)
; - 15% 이하 빨강, 16~30% 주황 (hack과 같은 #BF616A / #D08770)
; - ramp: low-at 이하 → 0번, full-at 이상 → 마지막, 그 사이는 round((잔량-15)/(99-15)×100)으로
;   남은 100칸에서 고름 → 칸 수(weight) 합 100으로 경계를 맞춤 (1~100% 전부 시험함)
; - 충전 중: 충전 아이콘이 차오르는 애니메이션 (20 → 40 → 60 → 80 → 100)
; - 간격(px, 잉크 기준): 아이콘→숫자 8, 앞 모듈과 24. 배터리(8px)는 충전 아이콘(13px)보다 좁아
;   앞을 5px 더 띄워 오른쪽 맞춤 → 충전 상태가 바뀌어도 모듈 폭 같음 (시계가 안 움직임)
[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ACAD
poll-interval = 5

; 11-04: 좌클릭 = adi1090x 배터리 애플릿 (applets type-5 style-3), 폭은 그대로
format-charging = %{A1:~/.config/rofi/applets/bin/battery.sh &:}%{O10}<animation-charging>%{O7}<label-charging>%{A}
format-discharging = %{A1:~/.config/rofi/applets/bin/battery.sh &:}%{O15}<ramp-capacity>%{O7}<label-discharging>%{A}
format-full = %{A1:~/.config/rofi/applets/bin/battery.sh &:}%{O15}<ramp-capacity>%{O7}<label-full>%{A}

; 숫자는 아이콘 쪽에 붙이고 남는 칸은 뒤로 (80% → "80% ", 폭은 100%와 같음)
label-charging = %percentage%%
label-charging-minlen = 4
label-charging-alignment = left
label-discharging = %percentage%%
label-discharging-minlen = 4
label-discharging-alignment = left
label-full = %percentage%%
label-full-minlen = 4
label-full-alignment = left

ramp-capacity-font = 9
animation-charging-font = 10

ramp-capacity-0 = 󰁺
ramp-capacity-0-foreground = #BF616A
ramp-capacity-1 = 󰁻
ramp-capacity-1-foreground = #D08770
ramp-capacity-1-weight = 13
ramp-capacity-2 = 󰁼
ramp-capacity-2-foreground = #D08770
ramp-capacity-2-weight = 6
ramp-capacity-3 = 󰁼
ramp-capacity-3-weight = 6
ramp-capacity-4 = 󰁽
ramp-capacity-4-weight = 12
ramp-capacity-5 = 󰁾
ramp-capacity-5-weight = 12
ramp-capacity-6 = 󰁿
ramp-capacity-6-weight = 12
ramp-capacity-7 = 󰂀
ramp-capacity-7-weight = 11
ramp-capacity-8 = 󰂁
ramp-capacity-8-weight = 12
ramp-capacity-9 = 󰂂
ramp-capacity-9-weight = 16
ramp-capacity-10 = 󰁹

animation-charging-0 = 󰂆
animation-charging-1 = 󰂈
animation-charging-2 = 󰂉
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-framerate = 750

[module/time]
type = internal/date
interval = 10
; 앞 모듈과 24px (잉크 기준)
format = %{O14}<label>

time = "%H:%M"
date = "%d %b"

label = %date%, %time%

; 추가 (기존 hack 바의 알림 센터 기능, hack처럼 날짜·시간 바로 오른쪽): dunst 알림 벨
; - 아이콘: 󰂚 기본, 󱅫 알림 있음 (표시 중·기록·대기), 󱏧 방해 금지. dunst D-Bus 신호로 바로 바뀜
;   (hack/scripts/notif-status.py, hack 바와 같은 스크립트)
; - 크기: 다른 아이콘처럼 높이 12px = font-10 (스크립트가 env-NOTIF_FONT 번호로 %{T11}을 붙임, hack 바는 기본 2)
; - 좌클릭: 알림 목록 (rofi, hack/scripts/notif-center.py) → 바 아래 오른쪽 (창 위쪽 끝 y 63·오른쪽 끝 12px에 맞춤)
;   Enter 다시 보기, Delete·우클릭 지우기, Alt+c 모두 지우기, Alt+d 방해 금지
; - 우클릭: 방해 금지 켜기/끄기
; - 간격(px, 잉크 기준): 시계와 24
[module/notif]
type = custom/script
exec = ~/.config/polybar/miniblocks/scripts/notif-status.py
tail = true
env-NOTIF_FONT = 11
format = %{O23}<label>%{O1}
click-left = ~/.config/polybar/miniblocks/scripts/notif-center.py -theme-str 'window { location: north east; anchor: north east; x-offset: -12px; y-offset: 63px; }' &
click-right = dunstctl set-paused toggle

; 추가 (11-03): 트레이 바 폭을 내용에 맞춰 늘이고 줄임 (polybar 3.7엔 이 기능이 없어 scripts/traywidth.py)
; - modules-right 맨 앞에 1px 표식(배경 + 알파 1/255, 눈에 안 보임)을 그리고, 바가 다시 그려질 때만 표식 위치를 찾아
;   보이는 영역(X Shape) = 표식 - 15px ~ 바 오른쪽 끝 (padding 16px와 같은 여백), 잘린 곳은 클릭도 통과
; - 음소거(숫자 칸이 빠짐)·Wi-Fi 끊김(×)처럼 내용 폭이 바뀌면 유리 배경 왼쪽 끝만 따라 움직임, 글자는 제자리, 평소 CPU 0
; - [bar/tray]의 width는 가장 넓은 상태 이상이어야 함 (넘치는 내용은 polybar가 잘라 버려 잴 수 없음)
; - 표식 색 env-TRAYWIDTH_MARK (기본 #1BFFFFFF): 바 배경색을 바꾸면 그 색 + 알파 1로
; - 11-04: 경계가 0.15초 동안 ease-out으로 미끄러짐 (env-TRAYWIDTH_ANIM = 초, 0이면 애니메이션 없이 바로)
[module/traywidth]
type = custom/script
exec = ~/.config/polybar/miniblocks/scripts/traywidth.py
tail = true
env-TRAYWIDTH_ANIM = 0.15
env-TRAYWIDTH_MARK = #4E000000

[module/pulseaudio]
type = internal/pulseaudio

; 아이콘 3개는 같은 크기(높이 12px), 소리 물결 끝을 오른쪽에 맞춤 → 숫자까지 늘 8px
; 바 왼쪽 끝 → 아이콘 23px (ws 바 양 끝과 같음, 25~74%일 때)
format-volume = %{O2}<ramp-volume>%{O7}<label-volume>
label-volume = %percentage%%
label-volume-minlen = 4
label-volume-alignment = left
ramp-volume-font = 6
use-ui-max = false
interval = 5

ramp-volume-0 = "%{O4}%{O-4}"
ramp-volume-1 = "%{O2}%{O-2}"
ramp-volume-2 = ""


; 원본: label-muted = "  muted" → 스피커 아이콘만
; 11-02: MDI volume-off U+F0581 → FA volume-xmark U+EEE8 (Nerd Fonts nf-fa-volume_xmark)
;        음량 아이콘과 같은 FA 세트·같은 35px → 스피커 모양이 같음, 오른쪽 끝도 음량 아이콘과 같은 x
; 11-03: 음소거 때 숫자 칸이 빠져 30px 좁아짐 → 바 폭을 traywidth가 줄여서 알림 벨 오른쪽에 빈 칸이 안 생김
;        (잠깐 %{O38}로 숫자 칸을 비워 두었다가 바 폭을 바꾸는 쪽으로 바꿈)
format-muted = %{O2}<label-muted>%{O9}
label-muted = ""
label-muted-font = 6

[settings]
screenchange-reload = true
;compositing-background = xor
;compositing-background = screen
;compositing-foreground = source
;compositing-border = over
;pseudo-transparency = true

[global/wm]
margin-top = 0
margin-bottom = 0

; vim:ft=dosini
                      

