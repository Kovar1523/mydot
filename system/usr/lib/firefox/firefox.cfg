// firefox.cfg
// - Ctrl+1~8 = N번째 탭, Ctrl+9 = 마지막 탭 (Linux 기본 Alt+숫자도 그대로 동작)
// - Ctrl+Shift+C (DevTools 인스펙터) 제거: 웹 페이지/웹 터미널이 키를 그대로 받는다
try {
  Services.obs.addObserver(win => {
    const doc = win.document;
    if (doc.getElementById("ctrlTabKeyset")) return;
    const keyset = doc.createXULElement("keyset");
    keyset.id = "ctrlTabKeyset";
    for (let n = 1; n <= 9; n++) {
      const key = doc.createXULElement("key");
      key.setAttribute("key", String(n));
      key.setAttribute("modifiers", "accel");
      key.addEventListener("command", event =>
        win.gBrowser.selectTabAtIndex(n === 9 ? -1 : n - 1, { event }));
      keyset.append(key);
    }
    doc.getElementById("mainKeyset").after(keyset);

    // DevTools 도 같은 알림에서 devtoolsKeyset 을 만들므로 한 틱 뒤에 뺀다
    Services.tm.dispatchToMainThread(() => {
      doc.getElementById("key_inspector")?.remove();
    });
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
